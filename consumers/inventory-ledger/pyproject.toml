[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mccann-hub-inventory-ledger"
version = "0.1.0"
description = "Independent installed-artifact YHMF inventory consumer"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["mccann-hub-yhmf==0.5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mccann_hub"]
