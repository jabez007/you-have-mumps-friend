name: Checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.5"
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m 'not native'
      - run: uv run python -m scripts.check_doc_examples
      - run: uv build
      - name: Smoke test the installed wheel
        run: |
          uv venv /tmp/yhmf-wheel --python 3.12
          uv pip install --python /tmp/yhmf-wheel/bin/python dist/*.whl
          /tmp/yhmf-wheel/bin/python -I scripts/smoke-wheel.py
  pydantic-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        pydantic: ["2.12.0", "2.14.3"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.5"
      - name: Qualify canonical contracts, legacy recovery, and mutation validation
        run: >-
          uv run --isolated --no-project --python 3.12
          --with 'pytest>=8,<9' --with 'hypothesis>=6,<7' --with 'pydantic==${{ matrix.pydantic }}'
          python -m pytest tests/test_schema_fingerprints.py
          tests/test_canonical_schema.py tests/test_schema_contracts.py
          tests/test_adversarial_properties.py tests/test_transaction_control.py tests/test_model_policies.py
          tests/test_query_validation.py
          tests/test_validation_migrations.py
          tests/test_compiled_declarations.py
          tests/test_collection_reads.py tests/test_batch_reads.py
          tests/test_migration_pruning.py tests/test_occurrence_queries.py
          tests/test_inverse_references.py tests/test_inventory_relations.py
          tests/test_model_reuse.py
          tests/test_virtual_computed.py tests/test_grouped_patches.py tests/test_typed_selectors.py
          tests/test_replacement_diffs.py
          tests/test_scoped_maintenance.py
          tests/test_transform_migrations.py
          tests/test_temporal_fields.py
          tests/test_inventory_timestamp_migration.py tests/test_inventory_warehouse_migration.py tests/test_inventory_location_migration.py tests/test_inventory_movement_ordering.py
          tests/test_uuid_fields.py
          tests/test_choice_fields.py
          tests/test_scalar_lists.py tests/test_constrained_lists.py tests/test_query_fields.py
          tests/test_schema_variant_migrations.py
          tests/test_delete_policies.py
          tests/test_ordered_indexes.py tests/test_ordered_queries.py tests/test_descending_queries.py tests/test_ordered_root_pages.py tests/test_ordered_query_budgets.py tests/test_query_intersections.py
          tests/test_m_writers.py tests/test_m_choice_writers.py tests/test_m_temporal_writers.py tests/test_m_hierarchy_primitives.py tests/test_m_owned_writers.py tests/test_m_writer_benchmark.py tests/test_global_views.py tests/test_adoption_checkpoints.py tests/test_resumable_adoption.py tests/test_stored_rollups.py tests/test_owned_rollups.py
          tests/test_inventory_example.py
          tests/test_migration_execution.py tests/test_nested_migrations.py tests/test_index_rebuilds.py
          tests/test_partial_mutations.py tests/test_child_mutations.py -m 'not native' -q
        env:
          PYTHONPATH: src
  adversarial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.5"
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -m 'adversarial and not native' --hypothesis-show-statistics
        env:
          YHMF_HYPOTHESIS_PROFILE: stress
          PYTHONHASHSEED: "0"
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            version: r2.02
            directory: yottadb_r202
            archive: yottadb_r202_x8664_ubuntu2204_pro.tgz
          - os: ubuntu-24.04
            version: r2.06
            directory: yottadb_r206
            archive: yottadb_r206_x8664_ubuntu2404_pro.tgz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.5"
      - name: Install YottaDB on the disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libelf-dev libicu-dev
          curl --fail --location --retry 3 -o /tmp/yottadb.tgz \
            https://github.com/YottaDB/YDB/releases/download/${{ matrix.version }}/${{ matrix.archive }}
          tar -xzf /tmp/yottadb.tgz -C /tmp
          cd /tmp/${{ matrix.directory }}
          sudo ./ydbinstall --installdir /opt/yottadb/test --utf8 \
            --nocopyenv --nocopyexec --nopkg-config --preserveRemoveIPC
      - run: uv sync --locked --extra native --python 3.12
        env:
          ydb_dist: /opt/yottadb/test
      - run: bash scripts/test-native.sh -q
        env:
          ydb_dist: /opt/yottadb/test
          YHMF_BENCHMARK: "1"
      - name: Run bounded native adversarial stress separately
        run: bash scripts/test-native.sh -m 'adversarial and native' -q --hypothesis-show-statistics
        env:
          ydb_dist: /opt/yottadb/test
          YHMF_HYPOTHESIS_PROFILE: stress
          PYTHONHASHSEED: "0"
      - name: Qualify native tests and benchmarks with before-image journaling
        run: bash scripts/test-native.sh -q
        env:
          ydb_dist: /opt/yottadb/test
          YHMF_JOURNALING: "1"
          YHMF_BENCHMARK: "1"
