name: Publish to PyPI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify package versions and release tag
        id: release
        run: python3 -m scripts.check_release
  qualification:
    needs: preflight
    uses: ./.github/workflows/release-candidate.yml
    with:
      expected_version: ${{ needs.preflight.outputs.version }}
  stage:
    needs: [preflight, qualification]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: qualified-candidate
          path: candidate
      - name: Verify qualification and stage only distributions
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 scripts/check_artifacts.py candidate --verify-qualified \
            --expected-version "$EXPECTED_VERSION" --expected-commit "$GITHUB_SHA" \
            --expected-run "$GITHUB_RUN_ID" --stage dist/pypi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pypi-distributions
          path: dist/pypi/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: stage
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/mccann-hub-yhmf/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pypi-distributions
          path: dist
      - name: Publish the qualified files through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          attestations: true
