name: Publish to TestPyPI
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact committed package version to qualify
        required: true
        default: "0.5.0"
      publish:
        description: Upload to TestPyPI; false validates and stages without uploading
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main for an upload
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "TestPyPI uploads must be dispatched from main" >&2
            exit 1
          fi
  qualification:
    needs: preflight
    uses: ./.github/workflows/release-candidate.yml
    with:
      expected_version: ${{ inputs.expected_version }}
  stage:
    needs: qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: qualified-candidate
          path: candidate
      - name: Verify qualification and stage only distributions
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 scripts/check_artifacts.py candidate --verify-qualified \
            --expected-version "$EXPECTED_VERSION" --expected-commit "$GITHUB_SHA" \
            --expected-run "$GITHUB_RUN_ID" --stage dist/testpypi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: testpypi-distributions
          path: dist/testpypi/
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: stage
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mccann-hub-yhmf/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: testpypi-distributions
          path: dist
      - name: Publish the qualified files through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          attestations: true
